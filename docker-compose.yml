services:
  api:
    build:
      context: ./backend
    ports:
      - "3000:3000"
    environment:
      - API_KEY=${API_KEY}
      - PORT=3000
      - HOST=0.0.0.0
      - MAX_CONCURRENCY=2
      - CONVERT_TIMEOUT_MS=300000
      - RATE_LIMIT_MAX=15
      - RATE_LIMIT_WINDOW=1 minute
      - JOB_TTL_MS=900000
      - SWEEP_INTERVAL_MS=3600000
      - SWEEP_MAX_AGE_MS=3600000
    restart: unless-stopped
